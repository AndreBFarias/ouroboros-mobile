name: ci

# R-AUDIT-CI-GATES (2026-07-11). Gate de qualidade server-side: roda
# ./scripts/smoke.sh (anonimato Regra -1, dados de teste, strings UI PT-BR
# acentuadas, contract drift, tsc, eslint, jest) em todo PR e push pra
# main. Coexiste com anonymity-check.yml (que audita metadados de commit).
#
# Quando marcado como required check em branch protection (o check name e'
# o nome do job: "quality-gate"; ver scripts/setup-branch-protection.sh),
# um PR com tsc vermelho, teste falhando, string UI sem acento ou mencao a
# IA no fonte NAO mergeia. E' a rede que OBRIGA os invariantes que ate
# aqui so' existiam como convencao manual (smoke rodado a mao) e hooks
# locais dormentes.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: quality-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install npm deps
        run: npm ci --legacy-peer-deps

      - name: Smoke (anonimato + PT-BR + test-data + tsc + eslint + jest + doctor de hooks)
        run: ./scripts/smoke.sh

  # AUDIT-P3-7 (2026-09-05). Piso de cobertura contra regressao, cobrado em
  # JOB SEPARADO -- nao como step do quality-gate, e nao dentro do
  # scripts/smoke.sh.
  #
  # Por que job separado: a AUDIT-P3-1 pretende promover `quality-gate` a
  # required status check da protecao de branch. O piso e' rente ao medido
  # (ver o bloco coverageThreshold em jest.config.js), entao uma queda de
  # decimo de ponto reprova. Dentro do gate obrigatorio isso viraria merge
  # bloqueado por ruido; num job proprio, ele acusa em vermelho sem travar
  # o merge enquanto o numero nao for recalibrado. Fora do smoke tambem
  # mantem o piso fora do caminho do pre-push local.
  #
  # Custo aceito: a suite roda uma segunda vez (~37s com coverage). A
  # alternativa -- trocar o `npm test` do smoke por uma unica execucao com
  # coverage -- foi considerada e descartada: colocaria o piso de volta
  # dentro do quality-gate e do pre-push, que e' exatamente o que este
  # arranjo evita.
  coverage-floor:
    name: coverage-floor
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install npm deps
        run: npm ci --legacy-peer-deps

      - name: Piso de cobertura (coverageThreshold de jest.config.js)
        run: npm run test:coverage
